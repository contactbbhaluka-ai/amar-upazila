# Android অ্যাপ বিল্ড: GitHub → Actions → "Android build" → Run workflow
# ফলাফল (Artifacts): app-debug.apk (ফোনে সরাসরি ইনস্টল করে পরীক্ষার জন্য)
# মনে রাখুন: নতুন ডিজাইন/ফিচার এখন main-এ push করলেই (Web deploy) সব অ্যাপে চলে যায়।
#            এই বিল্ড লাগে শুধু নেটিভ পরিবর্তনে: আইকন, নাম, পারমিশন, নতুন প্লাগইন।
#                    app-release-signed.aab (Play Console-এ আপলোডের জন্য)
name: Android build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FCM: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_UPAZILA_ID: ${{ vars.UPAZILA_ID || '1' }}
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

      # লাইভ আপডেট: অ্যাপ খুললে ওয়েবসাইট থেকে সর্বশেষ ডিজাইন/ফিচার আসে (Play Store আপডেট ছাড়াই)।
      # বন্ধ করতে চাইলে Settings → Variables-এ LIVE_UPDATE = false দিন; তখন সব ফাইল APK-এর ভেতরেই থাকবে।
      - name: Configure live update
        env:
          LIVE_URL: ${{ vars.PUBLIC_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          LIVE_UPDATE: ${{ vars.LIVE_UPDATE || 'true' }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs"), c = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            c.appendUserAgent = "AmarUpazilaApp/" + process.env.VERSION_CODE + (process.env.HAS_FCM === "true" ? " AUPush/2" : "");   // AUPush/2: নোটিফিকেশন থেকেই উত্তর   // অ্যাপ নিজের ভার্সন চিনতে পারে
            if (process.env.LIVE_UPDATE !== "false") {
              const u = new URL(process.env.LIVE_URL);
              c.server = { ...(c.server || {}), url: u.href, errorPath: "offline.html", allowNavigation: [u.hostname] };
            }
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));
            console.log(JSON.stringify(c, null, 2));
          '
          sed -i "s#__LIVE_URL__#${LIVE_URL}#" dist/offline.html

      - name: "Push notification plugin (শুধু GOOGLE_SERVICES_JSON সিক্রেট থাকলে, না থাকলে পুশ ছাড়াই বিল্ড)"
        if: env.HAS_FCM == 'true'
        run: npm install @capacitor/push-notifications@^7.0.0   # package.json-এ যোগ হলে তবেই cap sync প্লাগইনটা চেনে

      - name: Create / sync Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Microphone permission (মেসেজে ভয়েস রেকর্ডের জন্য)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n</manifest>#' "$M"
          grep -n "AUDIO\|microphone" "$M"

      - name: Speech recognition (সেবা ডিরেক্টরিতে কণ্ঠে খোঁজা)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RecognitionService "$M" || sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n</manifest>#' "$M"
          grep -n "RecognitionService" "$M"

      - name: Location permission (মেসেজে লোকেশন পাঠানোর জন্য)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$M"
          grep -n "LOCATION\|location" "$M"

      - name: "Google login deep link (Google থেকে অ্যাপে ফেরা, com.amarupazila.app://auth)"
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="auth"' "$M" || perl -0pi -e 's#(<activity\b[^>]*MainActivity.*?)(\s*</activity>)#$1\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="com.amarupazila.app" android:host="auth" />\n            </intent-filter>$2#s' "$M"
          grep -n 'android:host="auth"' "$M"

      - name: Firebase config + notification icon (পুশ নোটিফিকেশন)
        if: env.HAS_FCM == 'true'
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GSJ" > android/app/google-services.json
          python3 -c "import json;d=json.load(open('android/app/google-services.json'));print('Firebase project:',d['project_info']['project_id'])"
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_notify.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M12,4.2a4.6,4.6 0,1 1,0 9.2a4.6,4.6 0,1 1,0 -9.2z"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2.2" android:strokeLineCap="round" android:pathData="M4.6,20.2c1.7,-2.9 4.2,-4.3 7.4,-4.3s5.7,1.4 7.4,4.3"/>
          </vector>
          XML
          sed -i 's/^          //' android/app/src/main/res/drawable/ic_stat_notify.xml
          M=android/app/src/main/AndroidManifest.xml
          grep -q default_notification_icon "$M" || perl -0pi -e 's#(<application\b[^>]*>)#$1\n        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="\@drawable/ic_stat_notify" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="default" />#s' "$M"
          grep -n "default_notification" "$M"

      - name: "Message notification with reply (নোটিফিকেশন থেকেই মেসেজের উত্তর)"
        if: env.HAS_FCM == 'true'
        run: |
          D=android/app/src/main/java/com/amarupazila/app
          cp android-native/AuMessagingService.java android-native/AuReplyReceiver.java android-native/BubbleActivity.java "$D/"
          mkdir -p android/app/src/main/res/raw && cp android-native/au_notify.ogg android-native/au_notif.ogg android/app/src/main/res/raw/   # অ্যাপের নিজস্ব নোটিফিকেশন শব্দ
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@raw/au_notify,@raw/au_notif,@drawable/ic_stat_notify" />\n' > android/app/src/main/res/raw/au_keep.xml
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'xmlns:tools' "$M" || perl -0pi -e 's#<manifest\b#<manifest xmlns:tools="http://schemas.android.com/tools"#' "$M"
          grep -q AuMessagingService "$M" || perl -0pi -e 's#(<application\b[^>]*>)#$1\n        <service android:name="com.capacitorjs.plugins.pushnotifications.MessagingService" tools:node="remove" />\n        <service android:name=".AuMessagingService" android:exported="false">\n            <intent-filter>\n                <action android:name="com.google.firebase.MESSAGING_EVENT" />\n            </intent-filter>\n        </service>\n        <receiver android:name=".AuReplyReceiver" android:exported="false" />#s' "$M"
          # চ্যাট বাবলের জন্য আলাদা ছোট জানালা
          grep -q BubbleActivity "$M" || perl -0pi -e 's#(<application\b[^>]*>)#$1\n        <activity android:name=".BubbleActivity" android:theme="\@style/AppTheme.NoActionBar" android:allowEmbedded="true" android:resizeableActivity="true" android:documentLaunchMode="always" android:exported="false" android:windowSoftInputMode="adjustResize" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation|density" />#s' "$M"
          sed -i 's#default_notification_channel_id" android:value="default"#default_notification_channel_id" android:value="au_gen3"#' "$M"
          grep -n "tools\|AuMessaging\|AuReply\|MessagingService" "$M"
          # নিজের কোডে Firebase-এর ক্লাস (RemoteMessage) লাগে, তাই অ্যাপ মডিউলেও firebase-messaging
          G=android/app/build.gradle
          grep -q "firebase-messaging" "$G" || printf '\ndependencies {\n    implementation "com.google.firebase:firebase-messaging:${rootProject.ext.has(\x27firebaseMessagingVersion\x27) ? rootProject.ext.firebaseMessagingVersion : \x2724.1.0\x27}"\n}\n' >> "$G"
          tail -4 "$G"

      - name: Generate app icon and splash
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#006a4e' --iconBackgroundColorDark '#006a4e' --splashBackgroundColor '#006a4e' --splashBackgroundColorDark '#006a4e'

      - name: Set version (প্রতিটি বিল্ডে versionCode বাড়বে)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Gradle build
        working-directory: android
        run: |
          chmod +x gradlew
          # রিলিজে অপ্রয়োজনীয় কোড ও রিসোর্স ছেঁটে ফেলা (R8): অ্যাপ ছোট হয়
          cp app/build.gradle /tmp/build.gradle.orig
          sed -i -E 's/minifyEnabled false/minifyEnabled true\n            shrinkResources true/' app/build.gradle
          grep -nE "minifyEnabled|shrinkResources" app/build.gradle || true
          if ! ./gradlew --no-daemon assembleDebug bundleRelease; then
            echo "::warning::ছোট করা (R8) বিল্ড ব্যর্থ, সাধারণ বিল্ড করা হচ্ছে"
            cp /tmp/build.gradle.orig app/build.gradle
            ./gradlew --no-daemon assembleDebug bundleRelease
          fi

      - name: Sign release bundle
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          echo "$KS_B64" | base64 -d > upload.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore upload.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -signedjar app-release-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab "$KS_ALIAS"
          rm upload.jks

      - name: Warn if not signed
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 secret নেই, তাই AAB সাইন হয়নি। শুধু debug APK তৈরি হয়েছে। README-এর ধাপ ৫ দেখুন।"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: app-release-aab
          path: app-release-signed.aab
