# শুধু একবার চালাতে হবে: অ্যাপ সাইন করার "upload key" তৈরি করে।
# আগে Settings → Secrets → Actions-এ ANDROID_KEYSTORE_PASSWORD নামে একটা শক্ত পাসওয়ার্ড রাখুন।
# চালানোর পর Artifacts থেকে "upload-keystore" ডাউনলোড করুন (১ দিন পর মুছে যাবে)।
name: Make upload keystore (one time)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create keystore
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PASS" ]; then echo "::error::আগে ANDROID_KEYSTORE_PASSWORD secret তৈরি করুন (কমপক্ষে ৬ অক্ষর)"; exit 1; fi
          keytool -genkeypair -v -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Amar Upazila, O=Amar Upazila, C=BD"
          base64 -w0 upload.jks > keystore-base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: |
            upload.jks
            keystore-base64.txt
          retention-days: 1
